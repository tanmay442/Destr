name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: ragagent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ragagent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ragagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:ragagent_ci@127.0.0.1:5432/ragagent

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Get pnpm store path
        id: pnpm-store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- 0. Migration journal consistency ---------------------------
      - name: Drizzle journal check
        run: node scripts/check-drizzle-journal.mjs

      # ---- 1. Typecheck -------------------------------------------------
      - name: Typecheck
        run: pnpm typecheck

      # ---- 2. Lint -------------------------------------------------------
      - name: Lint
        run: pnpm lint

      # ---- 3. Architecture gate (dependency-cruiser) --------------------
      - name: Architecture gate
        run: pnpm arch

      - name: Prepare test database
        run: pnpm db:migrate

      - name: Unit & integration tests
        run: pnpm test
        env:
          AI_STUDIO_KEY: ${{ secrets.AI_STUDIO_KEY }}
          CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
          CUSTOM_LLM_BASE_URL: ${{ secrets.CUSTOM_LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      - name: Build
        run: pnpm exec next build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      # ---- E2E (DISABLED) ----------------------------------------------
      # E2E tests are disabled — Neon branch provisioning is flaky
      # in CI and the free-plan branch limit (10) fills up after
      # failed runs. Re-enable by uncommenting below and adding the
      # listed secrets to the repo's GitHub Actions secrets.
      #
      # - name: End-to-end tests
      #   if: ${{ env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != '' && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != '' }}
      #   run: |
      #     pnpm exec playwright install --with-deps chromium
      #     pnpm test:ci
      #   env:
      #     NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      #     NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      #     NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      #     CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Migrate production database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    if: github.ref == 'refs/heads/master'
    # Approval gate for prod DDL: configure required reviewers on the
    # "production" environment in repo settings.
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate production database
        run: pnpm db:migrate
        env:
          # DDL-capable role (owner). The app's DATABASE_URL is a
          # least-privilege role and must never run migrations.
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
