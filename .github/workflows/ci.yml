name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# One job, fast feedback. Order matches the developer mental
# model: cheapest static checks first, then the heavier
# integration build + e2e.
jobs:
  ci:
    name: Build / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragagent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ragagent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ragagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:ragagent_ci@127.0.0.1:5432/ragagent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm-store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- 0. Migration journal consistency ---------------------------
      - name: Drizzle journal check
        run: node scripts/check-drizzle-journal.mjs

      # ---- 1. Typecheck -------------------------------------------------
      - name: Typecheck
        run: pnpm typecheck

      # ---- 2. Lint -------------------------------------------------------
      - name: Lint
        run: pnpm lint

      # ---- 3. Architecture gate (dependency-cruiser) --------------------
      - name: Architecture gate
        run: pnpm arch

      - name: Prepare test database
        run: pnpm db:migrate

      - name: Unit & integration tests
        run: pnpm test
        env:
          AI_STUDIO_KEY: ${{ secrets.AI_STUDIO_KEY }}
          CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
          CUSTOM_LLM_BASE_URL: ${{ secrets.CUSTOM_LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      # ---- 3.5 Combined gate (test + typecheck + lint + arch) ----------
      # Runs the exact `pnpm gate` aggregate (added in phase 00) on top of
      # the individual fast-feedback steps above, so the single gate command
      # is CI-verified on every PR to master.
      - name: Gate (test + typecheck + lint + arch)
        run: pnpm gate
        env:
          AI_STUDIO_KEY: ${{ secrets.AI_STUDIO_KEY }}
          CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
          CUSTOM_LLM_BASE_URL: ${{ secrets.CUSTOM_LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      - name: Build
        run: pnpm exec next build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Migrate production database
        if: github.ref == 'refs/heads/master'
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ---- E2E (DISABLED) ----------------------------------------------
      # E2E tests are disabled — Neon branch provisioning is flaky
      # in CI and the free-plan branch limit (10) fills up after
      # failed runs. Re-enable by uncommenting below and adding the
      # listed secrets to the repo's GitHub Actions secrets.
