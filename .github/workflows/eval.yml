name: Eval

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      run_real:
        description: Run the keyed retrieval evaluation
        required: true
        default: true
        type: boolean

# Serialize runs per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    if: github.event_name == 'schedule' || inputs.run_real == true
    name: RAG Eval (real)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      EVAL_REAL: '1'
      EVAL_FAITHFULNESS_THRESHOLD: '0.7'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
      CHAT_PROVIDER: ${{ secrets.CHAT_PROVIDER }}
      AI_STUDIO_KEY: ${{ secrets.AI_STUDIO_KEY }}
      OPENAI_EMBEDDING_API_KEY: ${{ secrets.OPENAI_EMBEDDING_API_KEY }}
      OPENAI_EMBEDDING_BASE_URL: ${{ secrets.OPENAI_EMBEDDING_BASE_URL }}
      CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
      CUSTOM_LLM_BASE_URL: ${{ secrets.CUSTOM_LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm-store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval
        run: pnpm eval

      # Scheduled/manual evals have no PR to make the failure visible on, so
      # surface a drop below the faithfulness threshold (or a harness error)
      # as an issue instead of failing silently in the Actions tab.
      - name: Open eval-failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const title = 'RAG eval failed';
            const body = `The ${context.eventName} RAG eval failed (mean faithfulness below the threshold, or the harness errored). See [run ${context.runId}](${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}).`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Close stale eval-failure issue
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const title = 'RAG eval failed';
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
